spring.application.name=packet-analyzer

server.port=8080

# Allow large PCAP file uploads (up to 100MB)
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Logging
logging.level.com.dpi=DEBUG
logging.level.org.springframework=INFO
logging.pattern.console=%d{HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# App info
info.app.name=DPI Packet Analyzer
info.app.description=Deep Packet Inspection Engine - Java Spring Boot Port
info.app.version=1.0.0
