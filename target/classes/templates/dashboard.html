<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DPI Packet Analyzer Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f0f4f8;
            --primary-gradient: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            --card-bg: #ffffff;
            --text-main: #2d3748;
            --text-muted: #718096;
            --accent-blue: #3182ce;
            --accent-danger: #e53e3e;
            --accent-success: #38a169;
            --accent-info: #00b4d8;
            --border-radius: 12px;
            --transition-smooth: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Poppins', sans-serif;
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }

        /* Hero Header Styling */
        .hero-section {
            background: var(--primary-gradient);
            color: #ffffff;
            padding: 2.5rem 1rem;
            border-radius: 0 0 24px 24px;
            box-shadow: 0 10px 30px rgba(15, 32, 39, 0.2);
            position: relative;
            overflow: hidden;
        }

        .hero-section::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, transparent 70%);
            pointer-events: none;
        }

        .hero-section h2 {
            font-weight: 700;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        .hero-section p {
            font-weight: 300;
            color: #cbd5e0;
            letter-spacing: 1px;
        }

        /* Card Custom Pro Design */
        .card {
            background: var(--card-bg);
            border: none;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            transition: var(--transition-smooth);
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
        }

        .card-title-custom {
            font-weight: 600;
            font-size: 1.2rem;
            letter-spacing: -0.3px;
        }

        /* Form Inputs Pro Styling */
        .form-label {
            font-weight: 500;
            color: var(--text-main);
            font-size: 0.9rem;
            margin-bottom: 0.4rem;
        }

        .form-control, .form-select {
            border: 1.5px solid #e2e8f0;
            border-radius: 8px;
            padding: 0.6rem 0.9rem;
            font-size: 0.95rem;
            color: var(--text-main);
            transition: var(--transition-smooth);
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.15);
            outline: none;
        }

        /* Buttons Styling */
        .btn {
            font-weight: 500;
            border-radius: 8px;
            padding: 0.6rem 1.2rem;
            transition: var(--transition-smooth);
        }

        .btn-primary {
            background-color: #3182ce;
            border: none;
        }
        .btn-primary:hover {
            background-color: #2b6cb0;
            transform: translateY(-1px);
        }

        .btn-success {
            background-color: #38a169;
            border: none;
        }
        .btn-success:hover {
            background-color: #2f855a;
            transform: translateY(-1px);
        }

        .btn-outline-clear {
            border: 1.5px solid #cbd5e0;
            color: var(--text-muted);
            background: transparent;
        }
        .btn-outline-clear:hover {
            background-color: #feb2b2;
            color: #9b2c2c;
            border-color: #feb2b2;
        }

        /* Active Rules List Styling */
        .list-group-item {
            border: 1px solid #edf2f7;
            margin-bottom: 8px;
            border-radius: 8px !important;
            transition: var(--transition-smooth);
            background-color: #f7fafc;
        }

        .list-group-item:hover {
            background-color: #edf2f7;
        }

        .rule-badge {
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.25rem 0.6rem;
            border-radius: 50px;
            text-transform: uppercase;
        }

        .badge-domain { background-color: #ebf8ff; color: #2b6cb0; }
        .badge-ip { background-color: #e6fffa; color: #234e52; }
        .badge-app { background-color: #faf5ff; color: #553c9a; }

        .unlock-btn {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--accent-danger);
            transition: var(--transition-smooth);
        }
        .unlock-btn:hover {
            color: #9b2c2c;
            transform: scale(1.05);
        }

        /* Terminal Output Console */
        .console-output {
            background-color: #1a202c !important;
            color: #63b3ed !important;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            border: 2px solid #2d3748;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.5);
            border-radius: 8px;
        }
    </style>
</head>
<body>

<div class="hero-section text-center mb-5">
    <h2>🌐 DPI Packet Analyzer & Firewall Engine</h2>
    <p class="mb-0">Java 25 & Spring Boot Powered Deep Packet Inspection Tool</p>
</div>

<div class="container mb-5">
    <div class="row g-4">

        <div class="col-md-5">
            <div class="card p-4 mb-4">
                <h4 class="mb-3 card-title-custom text-primary">🚫 Add Blocking Rule</h4>
                <form id="ruleForm">
                    <div class="mb-3">
                        <label class="form-label">Rule Type</label>
                        <select class="form-select" id="ruleType">
                            <option value="domain">Domain Keyword (e.g., facebook)</option>
                            <option value="ip">IP Address (e.g., 192.168.1.1)</option>
                            <option value="app">Application (e.g., YOUTUBE)</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Value</label>
                        <input type="text" class="form-control" id="ruleValue" placeholder="Enter keyword, IP or App name" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 shadow-sm">Add Rule</button>
                </form>
            </div>

            <div class="card p-4">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4 class="card-title-custom text-dark mb-0">🔒 Active Policies</h4>
                    <button class="btn btn-sm btn-outline-clear" onclick="clearAllRules()">Clear All</button>
                </div>
                <ul class="list-group border-0" id="rulesList">
                </ul>
            </div>
        </div>

        <div class="col-md-7">
            <div class="card p-4 mb-4">
                <h4 class="mb-3 card-title-custom text-success">📂 Upload Traffic Log (PCAP)</h4>
                <form id="uploadForm">
                    <div class="mb-3">
                        <input class="form-control" type="file" id="pcapFile" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100 shadow-sm">Run Deep Packet Inspection</button>
                </form>
            </div>

            <div class="card p-4 d-none" id="reportCard">
                <h4 class="card-title-custom text-info mb-3">📊 Inspection Matrix Output</h4>
                <pre class="console-output p-3 m-0" id="reportOutput" style="max-height: 430px; overflow-y: auto;"></pre>
            </div>
        </div>

    </div>
</div>

<script>
    const API_BASE = "http://localhost:8080/api/dpi";

    // Fetch and display active rules on load
    async function fetchRules() {
        const res = await fetch(`${API_BASE}/rules`);
        const data = await res.json();
        const list = document.getElementById('rulesList');
        list.innerHTML = '';

        if(data.blockedDomains.length === 0 && data.blockedIps.length === 0 && data.blockedApps.length === 0) {
            list.innerHTML = `<li class="list-group-item text-muted text-center border-dashed py-4">No active enterprise blocking rules.</li>`;
            return;
        }

        data.blockedDomains.forEach(domain => {
            list.innerHTML += `<li class="list-group-item d-flex justify-content-between align-items-center border-0 shadow-sm mb-2">
                <span><span class="rule-badge badge-domain me-2">Domain</span> <strong>${domain}</strong></span>
                <button class="btn btn-sm btn-link unlock-btn text-decoration-none" onclick="unblockDomain('${domain}')">Unlock</button>
            </li>`;
        });

        data.blockedIps.forEach(ip => {
            list.innerHTML += `<li class="list-group-item border-0 shadow-sm mb-2">
                <span><span class="rule-badge badge-ip me-2">IP</span> <strong>${ip}</strong></span>
            </li>`;
        });

        data.blockedApps.forEach(app => {
            list.innerHTML += `<li class="list-group-item border-0 shadow-sm mb-2">
                <span><span class="rule-badge badge-app me-2">App</span> <strong>${app}</strong></span>
            </li>`;
        });
    }

    // Add Rule
    document.getElementById('ruleForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const type = document.getElementById('ruleType').value;
        const value = document.getElementById('ruleValue').value;

        let payload = {};
        if(type === 'domain') payload = { domain: value };
        if(type === 'ip') payload = { ip: value };
        if(type === 'app') payload = { app: value };

        await fetch(`${API_BASE}/rules/${type}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        document.getElementById('ruleValue').value = '';
        fetchRules();
    });

    // Unblock specific domain
    async function unblockDomain(name) {
        await fetch(`${API_BASE}/rules/domain/${name}`, { method: 'DELETE' });
        fetchRules();
    }

    // Clear all rules
    async function clearAllRules() {
        await fetch(`${API_BASE}/rules`, { method: 'DELETE' });
        fetchRules();
    }

    // Upload and Analyze PCAP File
    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const fileInput = document.getElementById('pcapFile');
        const formData = new FormData();
        formData.append('file', fileInput.files[0]);

        const reportCard = document.getElementById('reportCard');
        const reportOutput = document.getElementById('reportOutput');

        reportCard.classList.remove('d-none');
        reportOutput.innerText = "[SYSTEM INFO] Parsing layer-7 payload blocks...\n[SYSTEM INFO] Running multi-threaded rule validation matching...\n\nPlease wait...";

        try {
            const res = await fetch(`${API_BASE}/analyze`, {
                method: 'POST',
                body: formData
            });
            const data = await res.json();
            reportOutput.innerText = JSON.stringify(data, null, 2);
        } catch (err) {
            reportOutput.innerText = "[ERROR] Deep Packet Inspection analysis execution crashed or file bad format.";
        }
    });

    // Initial Load
    fetchRules();
</script>
</body>
</html>
